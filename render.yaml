services:
  - type: web
    name: resq-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MODELS_DIR
        value: models
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LIVE_MEMORY_FALLBACK
        value: "1"
      - key: VIDEO_PROCESSING_SECONDS
        value: "90"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: resq-redis
          property: connectionString

  - type: keyvalue
    name: resq-redis
    plan: free
    region: oregon
    ipAllowList: []
